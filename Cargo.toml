[package]
name = "modplayer"
version = "0.1.0"
edition = "2021"
authors = ["polyzium"]
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
lto = 'fat'
panic = 'abort'
codegen-units = 8

[dependencies]
byteorder = "1.4.3"
sdl2 = "0.38.0"
clap = { version = "4.5.60", features = ["derive"] }
anyhow = "1.0.102"

[dev-dependencies]
ctrlc = "3.5.2"

[features]
s3m = []
sdl2_audio = []